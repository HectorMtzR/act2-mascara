<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Máscara de Lava AR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌋</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
      }
    }
  </script>
</head>
<body>
  <main id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
  </main>

  <div id="loading" class="pill">Cargando…</div>
  <div id="no-face" class="pill" hidden>Muestra tu cara a la cámara</div>
  <div id="hint" class="hint" hidden>Abre la boca para hacer erupción 🌋</div>
  <button id="sound" class="sound" type="button" aria-label="Activar sonido">🔇</button>
  <div id="error" class="error" role="alert" hidden></div>
  <pre id="debug" class="debug" hidden></pre>

  <script type="module" src="js/main.js"></script>
</body>
</html>
